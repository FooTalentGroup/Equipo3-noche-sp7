spring.application.name=StockIA
server.port=${PORT:8080}

## Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

## Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
## SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## JWT (JSON Web Token)
# 256-bit key (32 bytes) encoded in Base64
jwt.secret=${JWT_SECRET}
# 8 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION}

## Swagger / OpenAPI - Documentacion
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Ocultar response headers por seguridad
springdoc.swagger-ui.displayRequestDuration=false
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

## CORS - Origenes permitidos para el frontend
web.cors.allowed-origins=http://localhost:*

## SendGrid configuration
sendgrid.api-key=${SENDGRID_API_KEY}

## Frontend URLs
frontend.baseUrl: ${FRONT_BASE_URL:http://localhost:3000}
frontend.verifyEmailUrl: ${VERIFYEMAIL_URL:/auth/veryfy-email}
frontend.resetPasswordUrl: ${RESETPASSWORD_URL:/auth/reset-password}

## Manejo de errores - Deshabilitar mapeo de recursos esteticos para que NoResourceFoundException funcione
spring.web.resources.add-mappings=false